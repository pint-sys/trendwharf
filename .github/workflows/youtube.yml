name: Update YouTube trending data

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: youtube-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch trending videos and stats
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_REGION: ${{ vars.YT_REGION || 'US' }}
        run: |
          if [ -z "$YT_API_KEY" ]; then
            echo "::warning::No YT_API_KEY secret yet. Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi
          python scripts/fetch_youtube.py

      - name: Save changes
        run: |
          git config user.name "trendwharf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update YouTube trending data"
            git push
          fi
